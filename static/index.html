<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>围棋 · 单机双人</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        html, body { height: 100%; overflow: hidden; font-family: 'Segoe UI', sans-serif; background: #deb887; }
        body { display: flex; flex-direction: column; padding: 10px; }
        h1 { text-align: center; font-size: clamp(1.2rem, 5vw, 2rem); margin: 5px 0; color: #2c3e50; flex-shrink: 0; }
        .main-container { display: flex; flex: 1; gap: 15px; min-height: 0; }
        .board-wrapper {
            flex: 1; display: flex; justify-content: center; align-items: center; min-width: 0;
            background: #c4a27a; border-radius: 12px; box-shadow: inset 0 0 10px rgba(0,0,0,0.2), 0 8px 20px rgba(0,0,0,0.3);
            padding: 8px;
        }
        canvas {
            display: block; max-width: 100%; max-height: 100%; width: auto; height: auto;
            aspect-ratio: 1 / 1; background: #eec085; border-radius: 6px; cursor: pointer;
            box-shadow: 0 0 0 2px #b68b5c;
        }
        .sidebar {
            width: 260px; background: rgba(255, 250, 240, 0.9); backdrop-filter: blur(8px);
            border-radius: 16px; padding: 18px 14px; box-shadow: 0 8px 25px rgba(0,0,0,0.25);
            display: flex; flex-direction: column; overflow-y: auto; border: 1px solid #e0c9a6;
            flex-shrink: 0;
        }
        .sidebar h3 { margin: 0 0 15px 0; color: #1e3c72; text-align: center; border-bottom: 2px solid #b68b5c; padding-bottom: 8px; }
        .info-panel {
            background: #f5efe6; border-radius: 10px; padding: 12px; margin-bottom: 20px;
            border-left: 5px solid #b68b5c;
        }
        .info-item { margin: 6px 0; }
        #turn-indicator { font-weight: bold; color: #1e3c72; font-size: 1.1rem; }
        #captures-info { font-weight: 500; }
        .action-buttons { display: flex; flex-direction: column; gap: 10px; margin-top: 5px; }
        button {
            font-size: 15px; padding: 10px 12px; border-radius: 8px; border: none;
            background: #4a6fa5; color: white; font-weight: bold; cursor: pointer;
            transition: all 0.2s;
        }
        button:hover { background: #3a5a8a; transform: translateY(-1px); }
        button:disabled { background: #aaa; cursor: not-allowed; }
        #message {
            margin-top: 10px; padding: 10px; background: #fff9e6; border-radius: 8px;
            color: #a94442; font-weight: 500; text-align: center; min-height: 55px;
        }
        .footer-note { margin-top: auto; font-size: 12px; color: #7a6a5a; text-align: center; padding-top: 10px; }
        @media (max-width: 700px) {
            .main-container { flex-direction: column; }
            .sidebar { width: 100%; max-height: 35vh; }
        }
    </style>
</head>
<body>
    <div class="main-container">
        <div class="board-wrapper">
            <canvas id="board"></canvas>
        </div>
        <div class="sidebar">
            <h3>⚫ 单机双人 ⚪</h3>
            <div class="info-panel">
                <div class="info-item" id="turn-indicator">⚫ 黑棋回合</div>
                <div class="info-item" id="captures-info">提子: 黑0 白0</div>
            </div>
            <div class="action-buttons">
                <button id="passBtn">⏸️ 虚着 (Pass)</button>
                <button id="resignBtn">🏳️ 认输</button>
                <button id="newGameBtn">🔄 新一局</button>
            </div>
            <div id="message"></div>
            <div class="footer-note">点击棋盘落子 · 轮流操作</div>
        </div>
    </div>
    <script>
        (function(){
            // ---------- 围棋规则引擎 (JavaScript 版) ----------
            const BOARD_SIZE = 19;

            class GameState {
                constructor() {
                    this.board = Array(BOARD_SIZE).fill().map(() => Array(BOARD_SIZE).fill(0)); // 0空 1黑 2白
                    this.blackTurn = true;           // true=黑棋走
                    this.blackCaptures = 0;
                    this.whiteCaptures = 0;
                    this.koPoint = null;              // { row, col } 禁止点
                    this.gameOver = false;
                    this.winner = null;               // 1黑胜 2白胜
                    this.consecutivePasses = 0;
                    this.prevBoardHash = "";
                }

                // 棋盘哈希（用于劫争同型检测）
                _boardHash() {
                    return this.board.map(row => row.join('')).join('');
                }

                // 获取相连同色组
                _getGroup(row, col, visitedSet) {
                    const color = this.board[row][col];
                    if (color === 0) return [];
                    const stack = [{r: row, c: col}];
                    const group = [];
                    const visited = visitedSet || new Set();
                    const key = (r,c) => `${r},${c}`;
                    
                    while (stack.length) {
                        const {r, c} = stack.pop();
                        if (visited.has(key(r,c))) continue;
                        visited.add(key(r,c));
                        if (this.board[r][c] !== color) continue;
                        group.push({r, c});
                        const dirs = [[1,0],[-1,0],[0,1],[0,-1]];
                        for (const [dr, dc] of dirs) {
                            const nr = r + dr, nc = c + dc;
                            if (nr >= 0 && nr < BOARD_SIZE && nc >= 0 && nc < BOARD_SIZE) {
                                if (!visited.has(key(nr,nc)) && this.board[nr][nc] === color) {
                                    stack.push({r: nr, c: nc});
                                }
                            }
                        }
                    }
                    return group;
                }

                // 计算一组棋子的气
                _countLiberties(group) {
                    const liberties = new Set();
                    for (const {r, c} of group) {
                        const dirs = [[1,0],[-1,0],[0,1],[0,-1]];
                        for (const [dr, dc] of dirs) {
                            const nr = r + dr, nc = c + dc;
                            if (nr >= 0 && nr < BOARD_SIZE && nc >= 0 && nc < BOARD_SIZE) {
                                if (this.board[nr][nc] === 0) {
                                    liberties.add(`${nr},${nc}`);
                                }
                            }
                        }
                    }
                    return liberties.size;
                }

                // 移除一组棋子并计提子
                _removeGroup(group) {
                    for (const {r, c} of group) {
                        const color = this.board[r][c];
                        if (color === 1) this.blackCaptures++;
                        else if (color === 2) this.whiteCaptures++;
                        this.board[r][c] = 0;
                    }
                }

                // 检查自杀
                _isSuicide(row, col, color) {
                    this.board[row][col] = color;
                    const group = this._getGroup(row, col);
                    const liberties = this._countLiberties(group);
                    this.board[row][col] = 0;
                    return liberties === 0;
                }

                // 落子
                placeStone(row, col) {
                    if (this.gameOver) return false;
                    if (row < 0 || row >= BOARD_SIZE || col < 0 || col >= BOARD_SIZE) return false;
                    if (this.board[row][col] !== 0) return false;
                    if (this.koPoint && this.koPoint.row === row && this.koPoint.col === col) return false;

                    const color = this.blackTurn ? 1 : 2;
                    const opponent = 3 - color;

                    // 保存状态以便回滚
                    const oldBoard = this.board.map(row => [...row]);
                    const oldCaptures = [this.blackCaptures, this.whiteCaptures];
                    const oldKo = this.koPoint;
                    const oldHash = this._boardHash();

                    // 临时落子
                    this.board[row][col] = color;

                    // 收集所有被杀的对方棋子组
                    const groupsToRemove = [];
                    const dirs = [[1,0],[-1,0],[0,1],[0,-1]];
                    for (const [dr, dc] of dirs) {
                        const nr = row + dr, nc = col + dc;
                        if (nr >= 0 && nr < BOARD_SIZE && nc >= 0 && nc < BOARD_SIZE) {
                            if (this.board[nr][nc] === opponent) {
                                const group = this._getGroup(nr, nc);
                                if (this._countLiberties(group) === 0) {
                                    groupsToRemove.push(group);
                                }
                            }
                        }
                    }

                    // 执行提子
                    for (const g of groupsToRemove) {
                        this._removeGroup(g);
                    }

                    // 检查自己的组是否有气（自杀判定）
                    const selfGroup = this._getGroup(row, col);
                    if (this._countLiberties(selfGroup) === 0) {
                        // 回滚
                        this.board = oldBoard;
                        this.blackCaptures = oldCaptures[0];
                        this.whiteCaptures = oldCaptures[1];
                        this.koPoint = oldKo;
                        return false;
                    }

                    // 全局同型检测
                    const newHash = this._boardHash();
                    if (newHash === this.prevBoardHash && this.prevBoardHash !== "") {
                        this.board = oldBoard;
                        this.blackCaptures = oldCaptures[0];
                        this.whiteCaptures = oldCaptures[1];
                        this.koPoint = oldKo;
                        return false;
                    }

                    // 更新劫点
                    this.koPoint = null;
                    if (groupsToRemove.length === 1 && groupsToRemove[0].length === 1) {
                        const {r, c} = groupsToRemove[0][0];
                        this.koPoint = { row: r, col: c };
                    }

                    this.prevBoardHash = oldHash;
                    this.blackTurn = !this.blackTurn;
                    this.consecutivePasses = 0;
                    return true;
                }

                // 虚着
                pass() {
                    if (this.gameOver) return false;
                    this.consecutivePasses++;
                    this.blackTurn = !this.blackTurn;
                    this.koPoint = null;
                    this.prevBoardHash = this._boardHash();

                    if (this.consecutivePasses >= 2) {
                        this.gameOver = true;
                        this.winner = null;  // 由玩家自行判断或数子，这里只标记结束
                    }
                    return true;
                }

                // 认输
                resign(playerColor) {
                    if (this.gameOver) return false;
                    this.gameOver = true;
                    this.winner = 3 - playerColor;  // 对方胜
                    return true;
                }

                // 重置游戏
                reset() {
                    this.board = Array(BOARD_SIZE).fill().map(() => Array(BOARD_SIZE).fill(0));
                    this.blackTurn = true;
                    this.blackCaptures = 0;
                    this.whiteCaptures = 0;
                    this.koPoint = null;
                    this.gameOver = false;
                    this.winner = null;
                    this.consecutivePasses = 0;
                    this.prevBoardHash = "";
                }

                // 转为前端展示格式
                toFrontendState() {
                    // 行列转置（前端习惯 x 为列，y 为行）
                    const boardTransposed = Array(BOARD_SIZE).fill().map(() => Array(BOARD_SIZE).fill(0));
                    for (let r = 0; r < BOARD_SIZE; r++) {
                        for (let c = 0; c < BOARD_SIZE; c++) {
                            boardTransposed[c][r] = this.board[r][c];
                        }
                    }
                    return {
                        board: boardTransposed,
                        turn: this.blackTurn ? 1 : 2,
                        gameOver: this.gameOver,
                        winner: this.winner,
                        ko: this.koPoint ? [this.koPoint.col, this.koPoint.row] : null,
                        captures: [this.blackCaptures, this.whiteCaptures],
                    };
                }
            }

            // ---------- 前端 UI ----------
            const canvas = document.getElementById('board');
            const ctx = canvas.getContext('2d');
            let game = new GameState();
            let canvasSize = 600;

            // UI 元素
            const turnIndicator = document.getElementById('turn-indicator');
            const capturesInfo = document.getElementById('captures-info');
            const messageDiv = document.getElementById('message');
            const passBtn = document.getElementById('passBtn');
            const resignBtn = document.getElementById('resignBtn');
            const newGameBtn = document.getElementById('newGameBtn');

            // 调整画布大小
            function resizeCanvas() {
                const container = canvas.parentElement;
                if (!container) return;
                const containerStyle = getComputedStyle(container);
                const padding = parseFloat(containerStyle.paddingLeft) + parseFloat(containerStyle.paddingRight);
                const availableWidth = container.clientWidth - padding;
                const availableHeight = container.clientHeight - padding;
                const size = Math.min(availableWidth, availableHeight);
                canvasSize = Math.max(400, Math.min(1000, size));
                canvas.width = canvasSize;
                canvas.height = canvasSize;
                drawBoard();
            }

            // 绘制棋盘
            function drawBoard() {
                const state = game.toFrontendState();
                const board = state.board;
                const cellSize = canvasSize / BOARD_SIZE;
                ctx.clearRect(0, 0, canvasSize, canvasSize);

                // 画网格
                ctx.strokeStyle = '#333';
                ctx.lineWidth = Math.max(1, cellSize * 0.03);
                const offset = cellSize / 2;
                for (let i = 0; i < BOARD_SIZE; i++) {
                    ctx.beginPath();
                    ctx.moveTo(i * cellSize + offset, offset);
                    ctx.lineTo(i * cellSize + offset, canvasSize - offset);
                    ctx.stroke();
                    ctx.beginPath();
                    ctx.moveTo(offset, i * cellSize + offset);
                    ctx.lineTo(canvasSize - offset, i * cellSize + offset);
                    ctx.stroke();
                }

                // 星位
                const stars = [[3,3],[9,9],[15,15],[3,15],[15,3],[3,9],[15,9],[9,3],[9,15]];
                const starRadius = cellSize * 0.12;
                stars.forEach(([x, y]) => {
                    ctx.beginPath();
                    ctx.arc(x * cellSize + offset, y * cellSize + offset, starRadius, 0, 2*Math.PI);
                    ctx.fillStyle = '#333';
                    ctx.fill();
                });

                // 画棋子
                const stoneRadius = cellSize * 0.42;
                for (let i = 0; i < BOARD_SIZE; i++) {
                    for (let j = 0; j < BOARD_SIZE; j++) {
                        const stone = board[i][j];
                        if (stone === 0) continue;
                        const cx = i * cellSize + offset;
                        const cy = j * cellSize + offset;
                        ctx.shadowColor = '#00000040';
                        ctx.shadowBlur = cellSize * 0.1;
                        const gradient = ctx.createRadialGradient(
                            cx - cellSize*0.15, cy - cellSize*0.15, cellSize*0.1,
                            cx, cy, stoneRadius
                        );
                        if (stone === 1) {
                            gradient.addColorStop(0, '#2a2a2a');
                            gradient.addColorStop(0.7, '#555');
                            gradient.addColorStop(1, '#1a1a1a');
                        } else {
                            gradient.addColorStop(0, '#fefefe');
                            gradient.addColorStop(0.5, '#e0e0e0');
                            gradient.addColorStop(1, '#b0b0b0');
                        }
                        ctx.fillStyle = gradient;
                        ctx.beginPath();
                        ctx.arc(cx, cy, stoneRadius, 0, 2*Math.PI);
                        ctx.fill();
                        ctx.shadowBlur = 0;
                        ctx.strokeStyle = '#666';
                        ctx.lineWidth = cellSize * 0.02;
                        ctx.stroke();
                    }
                }

                // 画劫标记
                if (state.ko) {
                    const [kx, ky] = state.ko;
                    const cx = kx * cellSize + offset;
                    const cy = ky * cellSize + offset;
                    ctx.beginPath();
                    ctx.arc(cx, cy, cellSize*0.2, 0, 2*Math.PI);
                    ctx.fillStyle = 'rgba(220, 20, 60, 0.6)';
                    ctx.fill();
                    ctx.strokeStyle = '#a00';
                    ctx.lineWidth = 2;
                    ctx.stroke();
                }
            }

            // 更新界面文字
            function updateUI() {
                const state = game.toFrontendState();
                const turn = state.turn;
                turnIndicator.innerHTML = turn === 1 ? '⚫ 黑棋回合' : '⚪ 白棋回合';
                capturesInfo.innerHTML = `提子: 黑${state.captures[0]} 白${state.captures[1]}`;

                if (state.gameOver) {
                    let msg = '游戏结束';
                    if (state.winner === 1) msg += '，黑方胜利！';
                    else if (state.winner === 2) msg += '，白方胜利！';
                    else msg += '，双方连续虚着，对局结束';
                    messageDiv.innerText = msg;
                    passBtn.disabled = true;
                    resignBtn.disabled = true;
                } else {
                    messageDiv.innerText = '';
                    passBtn.disabled = false;
                    resignBtn.disabled = false;
                }
                drawBoard();
            }

            // 尝试落子
            function tryPlaceStone(col, row) {
                if (game.gameOver) {
                    messageDiv.innerText = '游戏已结束，请开始新局';
                    return;
                }
                const success = game.placeStone(row, col);
                if (!success) {
                    messageDiv.innerText = '无效落子（禁着点或劫争）';
                } else {
                    messageDiv.innerText = '';
                }
                updateUI();
            }

            // 处理画布点击
            function handleCanvasClick(e) {
                const rect = canvas.getBoundingClientRect();
                const scaleX = canvas.width / rect.width;
                const scaleY = canvas.height / rect.height;
                const canvasX = (e.clientX - rect.left) * scaleX;
                const canvasY = (e.clientY - rect.top) * scaleY;
                const cellSize = canvasSize / BOARD_SIZE;
                const col = Math.floor(canvasX / cellSize);
                const row = Math.floor(canvasY / cellSize);
                if (col >= 0 && col < BOARD_SIZE && row >= 0 && row < BOARD_SIZE) {
                    tryPlaceStone(col, row);
                }
            }

            // 虚着
            function handlePass() {
                if (game.gameOver) return;
                game.pass();
                updateUI();
                if (game.gameOver) {
                    messageDiv.innerText = '双方连续虚着，游戏结束';
                }
            }

            // 认输
            function handleResign() {
                if (game.gameOver) return;
                const currentColor = game.blackTurn ? 1 : 2;
                if (confirm(`确定让 ${currentColor === 1 ? '黑方' : '白方'} 认输吗？`)) {
                    game.resign(currentColor);
                    updateUI();
                }
            }

            // 新游戏
            function handleNewGame() {
                game.reset();
                updateUI();
                messageDiv.innerText = '';
            }

            // 绑定事件
            function bindEvents() {
                canvas.addEventListener('click', handleCanvasClick);
                passBtn.addEventListener('click', handlePass);
                resignBtn.addEventListener('click', handleResign);
                newGameBtn.addEventListener('click', handleNewGame);
                window.addEventListener('resize', () => {
                    resizeCanvas();
                    drawBoard();
                });
            }

            // 初始化
            function init() {
                resizeCanvas();
                updateUI();
                bindEvents();
            }

            init();
        })();
    </script>
</body>
</html>
