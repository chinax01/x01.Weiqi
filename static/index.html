<!-- static/index.html -->
<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>围棋对弈 · 双人模式</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        html, body {
            height: 100%;
            overflow: hidden;
            font-family: 'Segoe UI', sans-serif;
            background: #deb887;
        }
        body {
            display: flex;
            flex-direction: column;
            padding: 10px;
        }
        h1 {
            text-align: center;
            font-size: clamp(1.2rem, 5vw, 2rem);
            margin: 5px 0;
            color: #2c3e50;
            flex-shrink: 0;
        }
        .main-container {
            display: flex;
            flex: 1;
            gap: 15px;
            min-height: 0;
        }
        .board-wrapper {
            flex: 1;
            display: flex;
            justify-content: center;
            align-items: center;
            min-width: 0;
            background: #c4a27a;
            border-radius: 12px;
            box-shadow: inset 0 0 10px rgba(0,0,0,0.2), 0 8px 20px rgba(0,0,0,0.3);
            padding: 8px;
        }
        canvas {
            display: block;
            max-width: 100%;
            max-height: 100%;
            width: auto;
            height: auto;
            aspect-ratio: 1 / 1;
            background: #eec085;
            border-radius: 6px;
            cursor: pointer;
            box-shadow: 0 0 0 2px #b68b5c;
        }
        .sidebar {
            width: 260px;
            background: rgba(255, 250, 240, 0.9);
            backdrop-filter: blur(8px);
            border-radius: 16px;
            padding: 18px 14px;
            box-shadow: 0 8px 25px rgba(0,0,0,0.25);
            display: flex;
            flex-direction: column;
            overflow-y: auto;
            border: 1px solid #e0c9a6;
            flex-shrink: 0;
        }
        .sidebar h3 {
            margin: 0 0 15px 0;
            color: #1e3c72;
            text-align: center;
            border-bottom: 2px solid #b68b5c;
            padding-bottom: 8px;
        }
        .control-group {
            margin-bottom: 20px;
        }
        .room-input-group {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }
        input, button {
            font-size: 15px;
            padding: 10px 12px;
            border-radius: 8px;
            border: 1px solid #ccc;
            transition: all 0.2s;
            font-family: inherit;
        }
        input {
            background: white;
        }
        button {
            background: #4a6fa5;
            color: white;
            border: none;
            font-weight: bold;
            cursor: pointer;
        }
        button:hover {
            background: #3a5a8a;
            transform: translateY(-1px);
        }
        button:disabled {
            background: #aaa;
            cursor: not-allowed;
        }
        .action-buttons {
            display: flex;
            flex-direction: column;
            gap: 10px;
            margin-top: 5px;
        }
        .info-panel {
            background: #f5efe6;
            border-radius: 10px;
            padding: 12px;
            margin-bottom: 20px;
            border-left: 5px solid #b68b5c;
        }
        .info-item {
            margin: 6px 0;
        }
        #turn-indicator {
            font-weight: bold;
            color: #1e3c72;
            font-size: 1.1rem;
        }
        #color-indicator {
            font-weight: bold;
            color: #8b4513;
        }
        #message {
            margin-top: 10px;
            padding: 10px;
            background: #fff9e6;
            border-radius: 8px;
            color: #a94442;
            font-weight: 500;
            text-align: center;
            min-height: 55px;
        }
        .footer-note {
            margin-top: auto;
            font-size: 12px;
            color: #7a6a5a;
            text-align: center;
            padding-top: 10px;
        }
        @media (max-width: 700px) {
            .main-container {
                flex-direction: column;
            }
            .sidebar {
                width: 100%;
                max-height: 35vh;
            }
        }
    </style>
</head>
<body>
    <div class="main-container">
        <div class="board-wrapper">
            <canvas id="board"></canvas>
        </div>
        <div class="sidebar">
            <h3>🎮 双人对弈</h3>
            <div class="control-group">
                <label>🏠 房间号</label>
                <div class="room-input-group">
                    <input type="text" id="roomId" placeholder="房间号" value="room1">
                    <button id="joinBtn">加入房间</button>
                </div>
            </div>
            <div class="info-panel">
                <div class="info-item" id="turn-indicator">⚫ 黑棋回合</div>
                <div class="info-item" id="color-indicator"></div>
                <div class="info-item" id="captures-info">提子: 黑0 白0</div>
            </div>
            <div class="action-buttons">
                <button id="passBtn" disabled>⏸️ 虚着 (Pass)</button>
                <button id="resignBtn" disabled>🏳️ 认输</button>
            </div>
            <div id="message"></div>
            <div class="footer-note">点击棋盘落子 · 等待对手加入</div>
        </div>
    </div>
    <script>
        (function(){
            const canvas = document.getElementById('board');
            const ctx = canvas.getContext('2d');
            const BOARD_SIZE = 19;
            let ws = null;
            let myColor = 0;
            let gameState = null;
            let roomId = '';
            let canvasSize = 600;

            function resizeCanvas() {
                const container = canvas.parentElement;
                if (!container) return;
                const containerStyle = getComputedStyle(container);
                const padding = parseFloat(containerStyle.paddingLeft) + parseFloat(containerStyle.paddingRight);
                const availableWidth = container.clientWidth - padding;
                const availableHeight = container.clientHeight - padding;
                const size = Math.min(availableWidth, availableHeight);
                canvasSize = Math.max(400, Math.min(1000, size));
                canvas.width = canvasSize;
                canvas.height = canvasSize;
                if (gameState) drawBoard(gameState.board);
                else drawEmptyBoard();
            }

            function drawEmptyBoard() { drawBoard(null); }

            function drawBoard(board) {
                const size = BOARD_SIZE;
                const cellSize = canvasSize / size;
                ctx.clearRect(0, 0, canvasSize, canvasSize);
                ctx.strokeStyle = '#333';
                ctx.lineWidth = Math.max(1, cellSize * 0.03);
                const offset = cellSize / 2;
                for (let i = 0; i < size; i++) {
                    ctx.beginPath();
                    ctx.moveTo(i * cellSize + offset, offset);
                    ctx.lineTo(i * cellSize + offset, canvasSize - offset);
                    ctx.stroke();
                    ctx.beginPath();
                    ctx.moveTo(offset, i * cellSize + offset);
                    ctx.lineTo(canvasSize - offset, i * cellSize + offset);
                    ctx.stroke();
                }
                const stars = [[3,3],[9,9],[15,15],[3,15],[15,3],[3,9],[15,9],[9,3],[9,15]];
                const starRadius = cellSize * 0.12;
                stars.forEach(([x, y]) => {
                    ctx.beginPath();
                    ctx.arc(x * cellSize + offset, y * cellSize + offset, starRadius, 0, 2*Math.PI);
                    ctx.fillStyle = '#333';
                    ctx.fill();
                });
                if (!board) return;
                const stoneRadius = cellSize * 0.42;
                for (let i = 0; i < size; i++) {
                    for (let j = 0; j < size; j++) {
                        const stone = board[i][j];
                        if (stone === 0) continue;
                        const cx = i * cellSize + offset;
                        const cy = j * cellSize + offset;
                        ctx.shadowColor = '#00000040';
                        ctx.shadowBlur = cellSize * 0.1;
                        const gradient = ctx.createRadialGradient(cx-cellSize*0.15, cy-cellSize*0.15, cellSize*0.1, cx, cy, stoneRadius);
                        if (stone === 1) {
                            gradient.addColorStop(0, '#2a2a2a');
                            gradient.addColorStop(0.7, '#555');
                            gradient.addColorStop(1, '#1a1a1a');
                        } else {
                            gradient.addColorStop(0, '#fefefe');
                            gradient.addColorStop(0.5, '#e0e0e0');
                            gradient.addColorStop(1, '#b0b0b0');
                        }
                        ctx.fillStyle = gradient;
                        ctx.beginPath();
                        ctx.arc(cx, cy, stoneRadius, 0, 2*Math.PI);
                        ctx.fill();
                        ctx.shadowBlur = 0;
                        ctx.strokeStyle = '#666';
                        ctx.lineWidth = cellSize * 0.02;
                        ctx.stroke();
                    }
                }
                if (gameState && gameState.ko) {
                    const [kx, ky] = gameState.ko;
                    const cx = kx * cellSize + offset;
                    const cy = ky * cellSize + offset;
                    ctx.beginPath();
                    ctx.arc(cx, cy, cellSize*0.2, 0, 2*Math.PI);
                    ctx.fillStyle = 'rgba(220, 20, 60, 0.6)';
                    ctx.fill();
                    ctx.strokeStyle = '#a00';
                    ctx.lineWidth = 2;
                    ctx.stroke();
                }
            }

            function updateUI() {
                if (!gameState) return;
                const turn = gameState.turn;
                document.getElementById('turn-indicator').innerHTML = turn === 1 ? '⚫ 黑棋回合' : '⚪ 白棋回合';
                const myTurn = (myColor === turn) && !gameState.game_over;
                document.getElementById('passBtn').disabled = !myTurn;
                document.getElementById('resignBtn').disabled = gameState.game_over;
                document.getElementById('color-indicator').innerText = myColor === 1 ? '你执黑' : (myColor === 2 ? '你执白' : '观战中');
                if (gameState.captures) {
                    document.getElementById('captures-info').innerHTML = `提子: 黑${gameState.captures[0]} 白${gameState.captures[1]}`;
                }
                if (gameState.game_over) {
                    let msg = '游戏结束';
                    if (gameState.winner) msg += `，${gameState.winner === 1 ? '黑方胜利' : '白方胜利'}`;
                    else msg += '，双方连续虚着，对局结束';
                    document.getElementById('message').innerText = msg;
                } else {
                    document.getElementById('message').innerText = '';
                }
            }

            function handleStateUpdate(state) {
                gameState = state;
                drawBoard(state.board);
                updateUI();
            }

            function sendMove(x, y) {
                if (!ws || ws.readyState !== WebSocket.OPEN) return;
                if (gameState.game_over) { alert("对局已结束"); return; }
                if (myColor !== gameState.turn) { alert("还没轮到你"); return; }
                ws.send(JSON.stringify({ type: 'move', x, y, color: myColor }));
            }

            function handleCanvasClick(e) {
                if (!gameState || gameState.game_over) return;
                const rect = canvas.getBoundingClientRect();
                const scaleX = canvas.width / rect.width;
                const scaleY = canvas.height / rect.height;
                const canvasX = (e.clientX - rect.left) * scaleX;
                const canvasY = (e.clientY - rect.top) * scaleY;
                const cellSize = canvasSize / BOARD_SIZE;
                const x = Math.floor(canvasX / cellSize);
                const y = Math.floor(canvasY / cellSize);
                if (x >= 0 && x < BOARD_SIZE && y >= 0 && y < BOARD_SIZE) sendMove(x, y);
            }

            function initWebSocket() {
                let baseRoom = document.getElementById('roomId').value.trim();
                if (!baseRoom) return;
                roomId = baseRoom;
                if (ws) ws.close();
                const protocol = location.protocol === 'https:' ? 'wss:' : 'ws:';
                ws = new WebSocket(`${protocol}//${location.host}/ws/${roomId}`);
                ws.onopen = () => { document.getElementById('message').innerText = '连接成功，等待对手...'; };
                ws.onmessage = (event) => {
                    const data = JSON.parse(event.data);
                    if (data.type === 'assign_color') {
                        myColor = data.color;
                        ws.send(JSON.stringify({ type: 'color_ack', color: myColor }));
                        document.getElementById('color-indicator').innerText = myColor === 1 ? '你执黑' : '你执白';
                    } else if (data.type === 'waiting') {
                        document.getElementById('message').innerText = data.message;
                    } else if (data.type === 'game_start' || data.type === 'state_update') {
                        handleStateUpdate(data.state);
                    } else if (data.type === 'opponent_left') {
                        document.getElementById('message').innerText = '对手离开了房间';
                        gameState.game_over = true;
                        updateUI();
                    } else if (data.type === 'game_over') {
                        alert(data.message);
                        if (gameState) gameState.game_over = true;
                        updateUI();
                    } else if (data.type === 'error') {
                        alert('错误: ' + data.message);
                    }
                };
                ws.onclose = () => {
                    document.getElementById('message').innerText = '连接已断开';
                    myColor = 0;
                    gameState = null;
                    drawEmptyBoard();
                    updateUI();
                };
            }

            function bindEvents() {
                canvas.addEventListener('click', handleCanvasClick);
                document.getElementById('passBtn').addEventListener('click', () => {
                    if (!ws || ws.readyState !== WebSocket.OPEN) return;
                    if (gameState.game_over) return;
                    ws.send(JSON.stringify({ type: 'pass', color: myColor }));
                });
                document.getElementById('resignBtn').addEventListener('click', () => {
                    if (!ws || ws.readyState !== WebSocket.OPEN) return;
                    if (confirm('确定认输吗？')) ws.send(JSON.stringify({ type: 'resign', color: myColor }));
                });
                document.getElementById('joinBtn').addEventListener('click', initWebSocket);
                window.addEventListener('resize', () => {
                    resizeCanvas();
                    if (gameState) drawBoard(gameState.board);
                    else drawEmptyBoard();
                });
            }

            window.addEventListener('load', () => {
                resizeCanvas();
                drawEmptyBoard();
                bindEvents();
            });
        })();
    </script>
</body>
</html>
